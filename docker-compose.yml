version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: smartgamble_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartgamble
      POSTGRES_USER: ${POSTGRES_USER:-smartgamble}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartgamble}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:
